name: Verify community package
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify committed distribution
        run: python3 scripts/package.py
      - name: Start packaged stdio server
        run: node scripts/smoke.mjs
      - name: Check distributable tools and browser transport
        working-directory: plugins/m5stack-preview
        run: node --test tests/application-server.test.mjs tests/device-profiles.test.mjs tests/host-support.test.mjs tests/portable-host.test.mjs tests/hardware-jobs.test.mjs tests/browser-preview.test.mjs tests/launcher.test.mjs ui/tests/speaker-pcm.test.mjs ui/tests/device-media.test.mjs ui/tests/live-microphone.test.mjs ui/tests/live-microphone-processor.test.mjs ui/tests/preview-connection.test.mjs
  native-host:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check host, compile and link a small C++ program
        run: python plugins/m5stack-preview/scripts/preflight.py --probe
      - name: Verify package bytes and launch the portable MCP server
        run: |
          python scripts/package.py
          node scripts/smoke.mjs
      - name: Exercise native host locks, private files and exact CoreS3 admission
        run: |
          python -B plugins/m5stack-preview/runtime/tests/host_portability_test.py
          python -B plugins/m5stack-preview/runtime/tests/build_recovery_test.py
      - name: Create an app in a path containing spaces
        run: python plugins/m5stack-preview/scripts/create_workspace.py --destination "${{ runner.temp }}/m5 builder app"
      - name: Fetch pinned native dependencies
        working-directory: ${{ runner.temp }}/m5 builder app
        run: python m5preview setup --browser-only
      - name: Build all five profiles
        shell: bash
        working-directory: ${{ runner.temp }}/m5 builder app
        run: |
          for profile in atoms3r stickcplus2 sticks3 cores3 cores3se; do
            python m5preview web-build --profile "$profile" || exit 1
          done
      - name: Run actual native workers with controls and known PCM
        run: node scripts/smoke.mjs --workspace "${{ runner.temp }}/m5 builder app"
      - name: Prepare pinned firmware tools without USB
        working-directory: ${{ runner.temp }}/m5 builder app
        run: python m5preview hardware setup --profile cores3
      - name: Compile exact standard CoreS3 firmware without USB
        working-directory: ${{ runner.temp }}/m5 builder app
        run: python m5preview hardware build --profile cores3
      - name: Retain compile/setup logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: host-logs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/m5 builder app/logs/*.log
            ${{ runner.temp }}/m5 builder app/.local/hardware/*.log
            ${{ runner.temp }}/m5 builder app/.build/firmware/**/build.log
          include-hidden-files: true
          retention-days: 3
