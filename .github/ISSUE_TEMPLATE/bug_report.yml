name: Bug report
description: Report a reproducible emulator, setup or hardware-workflow problem.
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, private audio, flash dumps or preview URLs containing tokens."
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: "0.7.38"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, browser and Codex version
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where does it fail?
      options:
        - Installation or build
        - Chrome emulator
        - Codex panel
        - Physical hardware
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Exact board or emulator profile
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result and actual result
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Redacted error or minimal app reproducer
